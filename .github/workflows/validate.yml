name: validate

on:
  push:
    branches:
      - main
  pull_request:

# Read-only: this workflow never publishes, signs, or uses secrets.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node:
          - 18
          - 20
          - 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo "No package-lock.json found; skipping install (the project targets zero runtime dependencies)."
          fi

      - name: Shell script syntax
        run: bash -n install.command

      - name: PowerShell syntax
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw install.ps1)) | Out-Null"
          else
            echo "pwsh not installed; skipping PowerShell syntax check"
          fi

      - name: Run tests
        run: npm test

      - name: Validate dictionary
        run: node tools/validate-dictionary.js

      - name: JSON parse check
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const skip = new Set(['node_modules', '.git', 'dist', 'coverage']);
          const files = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory()) {
                if (skip.has(entry.name)) continue;
                walk(path.join(dir, entry.name));
              } else if (entry.isFile() && entry.name.endsWith('.json')) {
                files.push(path.join(dir, entry.name));
              }
            }
          }

          walk('.');

          if (!fs.existsSync(path.join('dictionaries', 'zh-CN.json'))) {
            console.error('FAIL: dictionaries/zh-CN.json is missing.');
            process.exit(1);
          }

          const failures = [];
          for (const file of files.sort()) {
            try {
              JSON.parse(fs.readFileSync(file, 'utf8'));
              console.log(`ok   ${file}`);
            } catch (error) {
              failures.push(`${file}: ${error.message}`);
            }
          }

          if (failures.length > 0) {
            console.error('\nInvalid JSON files:');
            for (const failure of failures) console.error(`  - ${failure}`);
            process.exit(1);
          }

          console.log(`\nParsed ${files.length} JSON file(s) successfully.`);
          NODE
